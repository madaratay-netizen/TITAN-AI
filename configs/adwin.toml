# ADWIN OS configuration. Local-only + offline by default.
[server]
host = "127.0.0.1"   # loopback only — never expose to the network by default
port = 8077

[network]
offline_mode = true          # disable all outbound AI calls
isolation_verified = false   # set true ONLY after the offline test harness passes

[ai]
ollama_host = "http://127.0.0.1:11434"
default_model = "qwen3.5:4b"
