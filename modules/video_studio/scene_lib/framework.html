<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"/>
<style>html,body{margin:0;background:#0b0f14;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
/* ADWIN scene composition framework.
   The model only produces ADWIN_SCENE (JSON). The visual quality lives HERE:
   a reusable component library + deterministic seekTo(t) animation. */
window.ADWIN_SCENE = __ADWIN_SCENE_JSON__;

const SCENE = window.ADWIN_SCENE || {components:[],pipes:[],duration:8};
window.ADWIN_DURATION = SCENE.duration || 8;
window.ADWIN_FPS = 30;

const cv=document.getElementById('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
const byId={}; (SCENE.components||[]).forEach(c=>byId[c.id]=c);
function anchor(ref){ if(Array.isArray(ref)) return {x:ref[0],y:ref[1]};
  const c=byId[ref]; return c?{x:c.x,y:c.y}:{x:W/2,y:H/2}; }
function pop(t,appear){ const d=t-(appear||0); if(d<0) return 0; return Math.min(1, d/0.4); }
function ease(p){ return 1-Math.pow(1-p,3); }
/* Camera: optional keyframes [{t,zoom,x,y}] for pan/zoom/focus shots. */
function camAt(t){ const ks=SCENE.camera; if(!ks||!ks.length) return {zoom:1,x:W/2,y:H/2};
  let a=ks[0],b=ks[0];
  for(let i=0;i<ks.length;i++){ if((ks[i].t||0)<=t){a=ks[i]; b=ks[i+1]||ks[i];} }
  if(a===b || (b.t||0)<=(a.t||0)) return {zoom:a.zoom||1,x:a.x||W/2,y:a.y||H/2};
  const p=ease(Math.max(0,Math.min(1,(t-(a.t||0))/((b.t||0)-(a.t||0)))));
  const lerp=(u,v)=>u+(v-u)*p;
  return {zoom:lerp(a.zoom||1,b.zoom||1), x:lerp(a.x||W/2,b.x||W/2), y:lerp(a.y||H/2,b.y||H/2)}; }
function applyCamera(c){ ctx.translate(W/2,H/2); ctx.scale(c.zoom,c.zoom); ctx.translate(-c.x,-c.y); }

function label(x,y,ar,en,a){ if(a<=0)return; ctx.save(); ctx.globalAlpha=a;
  ctx.font='bold 22px "Segoe UI",Tahoma,Arial'; ctx.textAlign='center';
  ctx.fillStyle='#e6edf3'; ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=6; ctx.fillText(ar||'',x,y);
  if(en){ctx.font='14px "Segoe UI",Arial'; ctx.fillStyle='#8aa0b4'; ctx.shadowBlur=0; ctx.fillText(en,x,y+20);} ctx.restore(); }

/* ---------- component library (2.5D-ish) ---------- */
const COMP={
  pump(x,y,t){ const R=60;
    ctx.save();ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+R*0.8,R*1.05,R*0.3,0,0,7);ctx.fill();ctx.restore();
    const g=ctx.createLinearGradient(x-R,y-R,x+R,y+R);g.addColorStop(0,'#38506b');g.addColorStop(1,'#1c2c3e');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#5a7a90';ctx.stroke();
    ctx.fillStyle='#0f1922';ctx.beginPath();ctx.arc(x,y,R-14,0,7);ctx.fill();
    ctx.save();ctx.translate(x,y);ctx.rotate(t*5.0);
    for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);const gr=ctx.createLinearGradient(0,0,R-16,0);
      gr.addColorStop(0,'#9fc3e6');gr.addColorStop(1,'#3aa0ff');ctx.strokeStyle=gr;ctx.lineWidth=7;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(8,0);ctx.quadraticCurveTo((R-22)*0.6,10,(R-16),4);ctx.stroke();}
    ctx.fillStyle='#cfe3f5';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.restore(); },
  tank(x,y,t){ const w=90,h=130; const lvl=0.4+0.15*Math.sin(t*2);
    ctx.save();ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+h/2+6,w/2*1.1,10,0,0,7);ctx.fill();ctx.restore();
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,'#44607e');g.addColorStop(.5,'#6a8bad');g.addColorStop(1,'#2a3e55');
    ctx.fillStyle=g;ctx.fillRect(x-w/2,y-h/2,w,h);
    // liquid
    ctx.save();ctx.beginPath();ctx.rect(x-w/2+4,y-h/2+4,w-8,h-8);ctx.clip();
    ctx.fillStyle='#1d6fb8';ctx.fillRect(x-w/2,y+h/2-h*lvl,w,h*lvl);
    ctx.fillStyle='rgba(90,180,255,.5)';ctx.fillRect(x-w/2,y+h/2-h*lvl,w,4);ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle='#6a8bad';ctx.strokeRect(x-w/2,y-h/2,w,h);
    ctx.fillStyle='#2a3e55';ctx.beginPath();ctx.ellipse(x,y-h/2,w/2,10,0,0,7);ctx.fill(); },
  motor(x,y,t){ const w=84,h=58;
    const g=ctx.createLinearGradient(0,y-h/2,0,y+h/2);g.addColorStop(0,'#5a4a2a');g.addColorStop(1,'#3a2e18');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,8);ctx.fill();
    ctx.strokeStyle='#7a5a2a';ctx.lineWidth=3;ctx.stroke();
    // cooling fins
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(x+i*10,y-h/2+6);ctx.lineTo(x+i*10,y+h/2-6);ctx.stroke();}
    // shaft spinning
    ctx.save();ctx.translate(x+w/2,y);ctx.rotate(t*8);ctx.strokeStyle='#cfe3f5';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,8);ctx.stroke();ctx.restore(); },
  valve(x,y,t){ const r=26;
    ctx.fillStyle='#3a2e18';ctx.fillRect(x-8,y-r-14,16,14);
    const g=ctx.createLinearGradient(x-r,0,x+r,0);g.addColorStop(0,'#b85a2a');g.addColorStop(1,'#7a3a18');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='#d87a4a';ctx.lineWidth=3;ctx.stroke();
    // handwheel turning
    ctx.save();ctx.translate(x,y-r-14);ctx.rotate(t*1.5);ctx.strokeStyle='#cfe3f5';ctx.lineWidth=3;
    for(let i=0;i<3;i++){ctx.rotate(Math.PI/3*2);ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke();}ctx.restore(); },
  person(x,y,t){ const bob=Math.sin(t*3)*3; y+=bob; // simple worker figure (أنسنة)
    ctx.strokeStyle='#e6c38a';ctx.fillStyle='#e6c38a';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(x,y-46,12,0,7);ctx.fill(); // head
    ctx.fillStyle='#f5a524';ctx.beginPath();ctx.arc(x,y-52,14,Math.PI,0);ctx.fill(); // helmet
    ctx.strokeStyle='#3aa0ff';ctx.beginPath();ctx.moveTo(x,y-32);ctx.lineTo(x,y);ctx.stroke(); // body
    ctx.beginPath();ctx.moveTo(x,y-26);ctx.lineTo(x-16,y-10+Math.sin(t*3)*4);ctx.moveTo(x,y-26);ctx.lineTo(x+16,y-14);ctx.stroke(); // arms
    ctx.strokeStyle='#2a3e55';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-12,y+26);ctx.moveTo(x,y);ctx.lineTo(x+12,y+26);ctx.stroke(); },
  gauge(x,y,t){ const r=28; ctx.fillStyle='#e6edf3';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.strokeStyle='#2a3e55';ctx.lineWidth=3;ctx.stroke();
    const ang=-Math.PI*0.75+ (0.5+0.4*Math.sin(t*2))*Math.PI*1.5;
    ctx.strokeStyle='#c0392b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(ang)*r*0.8,y+Math.sin(ang)*r*0.8);ctx.stroke();
    ctx.fillStyle='#2a3e55';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill(); },
  box(x,y,t){ ctx.fillStyle='#2a3e55';ctx.beginPath();ctx.roundRect(x-44,y-34,88,68,8);ctx.fill();
    ctx.strokeStyle='#4a6a90';ctx.lineWidth=3;ctx.stroke(); },
  conveyor(x,y,t){ const w=150,h=20;
    ctx.fillStyle='#1c2c3e';ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,10);ctx.fill();
    ctx.strokeStyle='#3a5068';ctx.lineWidth=3;ctx.stroke();
    for(let rx=-w/2+14;rx<=w/2-14;rx+=28){ctx.fillStyle='#4a6a90';ctx.beginPath();ctx.arc(x+rx,y,8,0,7);ctx.fill();
      ctx.save();ctx.translate(x+rx,y);ctx.rotate(t*4);ctx.strokeStyle='#223246';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.stroke();ctx.restore();}
    // moving boxes
    for(let i=0;i<3;i++){const bx=x-w/2+((t*50+i*60)%(w))-20;ctx.fillStyle='#caa04a';ctx.beginPath();ctx.roundRect(bx,y-h/2-22,22,20,3);ctx.fill();ctx.strokeStyle='#8a6a2a';ctx.lineWidth=2;ctx.stroke();} },
  panel(x,y,t){ const w=70,h=100;
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,'#3a4a5a');g.addColorStop(1,'#1c2630');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,6);ctx.fill();
    ctx.strokeStyle='#5a7a90';ctx.lineWidth=3;ctx.stroke();
    // blinking indicators
    const cols=['#36d399','#f5a524','#f06060'];
    for(let i=0;i<3;i++){const on=(Math.sin(t*4+i*2)>0);ctx.fillStyle=on?cols[i]:'#223';ctx.beginPath();ctx.arc(x-18+i*18,y-h/2+18,5,0,7);ctx.fill();}
    // breakers
    for(let r=0;r<3;r++)for(let c=0;c<2;c++){ctx.fillStyle='#0f1922';ctx.fillRect(x-24+c*26,y-10+r*24,20,16);
      ctx.fillStyle='#3aa0ff';ctx.fillRect(x-24+c*26+ (Math.sin(t*2+r)>0?2:10),y-8+r*24,6,12);} },
  transformer(x,y,t){ const w=84,h=70;
    const g=ctx.createLinearGradient(0,y-h/2,0,y+h/2);g.addColorStop(0,'#4a5a6a');g.addColorStop(1,'#263440');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,6);ctx.fill();ctx.strokeStyle='#6a8aa0';ctx.lineWidth=3;ctx.stroke();
    // cooling fins
    ctx.strokeStyle='#2a3e55';ctx.lineWidth=5;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(x+i*11,y-h/2);ctx.lineTo(x+i*11,y+h/2);ctx.stroke();}
    // HV bushings + spark
    ctx.fillStyle='#caa04a';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x+i*24,y-h/2);ctx.lineTo(x+i*24,y-h/2-18);ctx.lineWidth=5;ctx.strokeStyle='#caa04a';ctx.stroke();ctx.beginPath();ctx.arc(x+i*24,y-h/2-20,5,0,7);ctx.fill();}
    if(Math.sin(t*6)>0.9){ctx.strokeStyle='#9fe6ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-24,y-h/2-20);ctx.lineTo(x,y-h/2-28);ctx.lineTo(x+24,y-h/2-20);ctx.stroke();} },
  generator(x,y,t){ const r=46;
    const g=ctx.createLinearGradient(x-r,y-r,x+r,y+r);g.addColorStop(0,'#2a4a3a');g.addColorStop(1,'#163024');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-r,y-r*0.8,r*2,r*1.6,10);ctx.fill();ctx.strokeStyle='#36d399';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#36d399';ctx.font='bold 34px Arial';ctx.textAlign='center';ctx.fillText('G',x,y+10);
    ctx.save();ctx.translate(x+r,y);ctx.rotate(t*10);ctx.strokeStyle='#cfe3f5';ctx.lineWidth=3;
    for(let i=0;i<3;i++){ctx.rotate(Math.PI/1.5);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(12,0);ctx.stroke();}ctx.restore();ctx.textAlign='left'; },
  manhole(x,y,t){ // cross-section
    ctx.fillStyle='#2a2018';ctx.fillRect(x-70,y-6,140,60); // ground
    ctx.fillStyle='#0f1922';ctx.beginPath();ctx.ellipse(x,y+30,34,38,0,0,7);ctx.fill(); // chamber
    ctx.strokeStyle='#3a5068';ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle='#4a6a90';ctx.beginPath();ctx.ellipse(x,y-6,24,8,0,0,7);ctx.fill(); // cover
    // flowing water at bottom
    ctx.save();ctx.beginPath();ctx.ellipse(x,y+30,30,34,0,0,7);ctx.clip();
    ctx.fillStyle='#1d6fb8';ctx.fillRect(x-30,y+44,60,20);
    ctx.strokeStyle='rgba(90,180,255,.5)';ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.lineDashOffset=-t*30;ctx.beginPath();ctx.moveTo(x-30,y+48);ctx.lineTo(x+30,y+48);ctx.stroke();ctx.restore(); },
  filter(x,y,t){ const w=50,h=110;
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,'#5a6a7a');g.addColorStop(.5,'#8aa0b4');g.addColorStop(1,'#3a4a5a');
    ctx.fillStyle=g;ctx.fillRect(x-w/2,y-h/2,w,h);ctx.strokeStyle='#8aa0b4';ctx.lineWidth=2;ctx.strokeRect(x-w/2,y-h/2,w,h);
    ctx.fillStyle='#2a3e55';ctx.beginPath();ctx.ellipse(x,y-h/2,w/2,8,0,0,7);ctx.fill();
    // mesh
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;for(let i=-4;i<5;i++){ctx.beginPath();ctx.moveTo(x-w/2,y+i*12);ctx.lineTo(x+w/2,y+i*12);ctx.stroke();}
    // bubbles
    for(let i=0;i<4;i++){const by=y+h/2-((t*40+i*30)%h);ctx.fillStyle='rgba(90,180,255,.5)';ctx.beginPath();ctx.arc(x-10+i*7,by,3,0,7);ctx.fill();} },
  compressor(x,y,t){ const w=96,h=46;
    ctx.fillStyle='#3a4a5a';ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,20);ctx.fill();ctx.strokeStyle='#5a7a90';ctx.lineWidth=3;ctx.stroke();
    // piston cylinder on top
    ctx.fillStyle='#2a3e55';ctx.fillRect(x-10,y-h/2-26,20,26);
    const pp=(Math.sin(t*8)*0.5+0.5)*14;ctx.fillStyle='#cfe3f5';ctx.fillRect(x-7,y-h/2-22+pp,14,10);
    ctx.fillStyle='#8aa0b4';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('AIR',x,y+6);ctx.textAlign='left'; },
  fan(x,y,t){ const r=42;
    ctx.fillStyle='#1c2c3e';ctx.beginPath();ctx.arc(x,y,r+6,0,7);ctx.fill();ctx.strokeStyle='#4a6a90';ctx.lineWidth=4;ctx.stroke();
    ctx.save();ctx.translate(x,y);ctx.rotate(t*12);
    for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.fillStyle='#6a8bad';ctx.beginPath();ctx.ellipse(r*0.5,0,r*0.5,r*0.22,0,0,7);ctx.fill();}
    ctx.fillStyle='#cfe3f5';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();ctx.restore(); },
  mixer(x,y,t){ const w=84,h=110;
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,'#44607e');g.addColorStop(1,'#2a3e55');
    ctx.fillStyle=g;ctx.fillRect(x-w/2,y-h/2,w,h);ctx.strokeStyle='#6a8bad';ctx.lineWidth=2;ctx.strokeRect(x-w/2,y-h/2,w,h);
    ctx.save();ctx.beginPath();ctx.rect(x-w/2+3,y-h/2+30,w-6,h-33);ctx.clip();ctx.fillStyle='#8a5a2a';ctx.fillRect(x-w/2,y-10,w,h);
    ctx.save();ctx.translate(x,y+20);ctx.rotate(t*6);ctx.strokeStyle='#cfe3f5';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(26,0);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(0,20);ctx.stroke();ctx.restore();ctx.restore();
    // motor on top
    ctx.fillStyle='#3a2e18';ctx.fillRect(x-14,y-h/2-20,28,20); }
};

function drawPipe(a,b,t,appear){ const p=pop(t,appear); if(p<=0)return;
  ctx.save();ctx.lineCap='round';ctx.globalAlpha=1;
  const bx=a.x+(b.x-a.x)*ease(p), by=a.y+(b.y-a.y)*ease(p);
  ctx.strokeStyle='#223246';ctx.lineWidth=20;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(bx,by);ctx.stroke();
  ctx.strokeStyle='#2f4660';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(bx,by);ctx.stroke();
  if(p>=1){ctx.strokeStyle='#3aa0ff';ctx.lineWidth=4;ctx.setLineDash([12,18]);ctx.lineDashOffset=-t*60;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  ctx.restore(); }

window.seekTo=function(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d1824');g.addColorStop(1,'#080c11');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(58,160,255,.05)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  ctx.save(); applyCamera(camAt(t));   // --- camera layer begins ---
  // pipes first (behind components)
  (SCENE.pipes||[]).forEach(pp=>drawPipe(anchor(pp.from),anchor(pp.to),t,pp.appear||0));

  // components
  (SCENE.components||[]).forEach(c=>{ const p=pop(t,c.appear); if(p<=0)return;
    ctx.save(); ctx.globalAlpha=p; const s=0.6+0.4*ease(p);
    ctx.translate(c.x,c.y);ctx.scale(s,s);ctx.translate(-c.x,-c.y);
    (COMP[c.type]||COMP.box)(c.x,c.y,t); ctx.restore(); });

  // labels with leader lines (appear a touch after their component)
  (SCENE.components||[]).forEach(c=>{ const a=pop(t,(c.appear||0)+0.5); if(a<=0||!c.label)return;
    const lx=c.x, ly=c.y-70;
    ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#3aa0ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(c.x,c.y-30);ctx.lineTo(lx,ly+8);ctx.stroke();ctx.restore();
    label(lx,ly,c.label,c.en||'',a); });
  (SCENE.pipes||[]).forEach(pp=>{ if(!pp.label)return; const a=anchor(pp.from),b=anchor(pp.to);
    const al=pop(t,(pp.appear||0)+0.6); label((a.x+b.x)/2,(a.y+b.y)/2-16,pp.label,pp.en||'',al); });

  ctx.restore();   // --- camera layer ends (title stays in screen space) ---

  // title
  const ta=Math.min(1,Math.max(0,(t-0.2)/0.6));
  ctx.save();ctx.globalAlpha=ta;ctx.textAlign='center';
  ctx.font='bold 38px "Segoe UI",Tahoma,Arial';ctx.fillStyle='#36d399';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=10;
  ctx.fillText(SCENE.title||'',W/2,52);
  ctx.font='17px "Segoe UI",Arial';ctx.fillStyle='#8aa0b4';ctx.shadowBlur=0;
  ctx.fillText(SCENE.subtitle||'ADWIN OS',W/2,76);ctx.restore();
};
window.seekTo(0);
</script></body></html>
